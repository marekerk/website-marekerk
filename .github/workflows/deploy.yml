name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Astro site
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # Optional: set this repository secret/variable for a custom domain.
          # SITE_URL: https://example.com
          # Agenda: repository variables (Settings → Secrets and variables → Actions → Variables).
          # Niet gezet = leeg; de agendalijst toont dan alleen de vaste diensttijden.
          PUBLIC_AGENDA_PROXY_URL: ${{ vars.PUBLIC_AGENDA_PROXY_URL }}
          PUBLIC_AGENDA_ICS_URL: ${{ vars.PUBLIC_AGENDA_ICS_URL }}
          PUBLIC_AGENDA_WEBCAL_URL: ${{ vars.PUBLIC_AGENDA_WEBCAL_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
